name: Daily XP Refresh

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  crawl-player-xp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OVH_S3_ENDPOINT: ${{ secrets.OVH_S3_ENDPOINT }}
      OVH_S3_REGION: ${{ secrets.OVH_S3_REGION }}
      OVH_S3_BUCKET: ${{ secrets.OVH_S3_BUCKET }}
      OVH_S3_ACCESS_KEY_ID: ${{ secrets.OVH_S3_ACCESS_KEY_ID }}
      OVH_S3_SECRET_ACCESS_KEY: ${{ secrets.OVH_S3_SECRET_ACCESS_KEY }}
      XP_REFRESH_MAX_PLAYERS: ${{ secrets.XP_REFRESH_MAX_PLAYERS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh player XP cache
        run: node scripts/crawl-player-xp-refresh.mjs

      - name: Enrich player metadata
        run: node scripts/enrich-players.mjs

      - name: Archive match history to S3 (Parquet)
        run: node scripts/archive-match-history.mjs --days 7

      - name: Roll up daily stats
        run: node scripts/stats-rollup-daily.mjs --days 7

      - name: Refresh stats from daily rollups
        run: node scripts/stats-refresh-daily.mjs

      - name: Prune match history (keep 7 days)
        run: node scripts/prune-match-history.mjs --keepDays 7
